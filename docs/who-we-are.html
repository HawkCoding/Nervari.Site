<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who We Are — Nervari</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:#0C0821;color:#fff;font-family:'Inter',sans-serif;font-size:17px;overflow-x:hidden}
a{color:inherit;text-decoration:none}::selection{background:rgba(91,93,225,0.4)}
.btn-primary:hover{box-shadow:0 0 40px rgba(91,93,225,0.65)!important;transform:translateY(-1px)}
.val-card{transition:transform 0.22s,border-color 0.22s}
.val-card:hover{transform:translateY(-4px);border-color:rgba(91,93,225,0.35)!important}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoLetterPulse{0%,100%{opacity:.13;transform:translateY(-52%) scale(1)}50%{opacity:.22;transform:translateY(-52%) scale(1.07)}}
</style>
</head>
<body>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">

// Inline brand-protected icons (removed from Simple Icons CDN)
const BrandIcon = ({ name, size = 44 }) => {
  const paths = {
    openai: (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v3l-2.597 1.5-2.607-1.5z"/>
      </svg>
    ),
    slack: (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>
      </svg>
    ),
    microsoft: (
      <svg width={size} height={size} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff" d="M0 0h11.377v11.372H0zm12.623 0H24v11.372H12.623zM0 12.623h11.377V24H0zm12.623 0H24V24H12.623z"/>
      </svg>
    ),
  };
  return paths[name] || null;
};

const WhoPage = () => (
  <div>
    <SiteNav active="Who We Are"/>

    {/* HERO / INTRO */}
    <section style={{ background:'#0C0821', padding:'140px 32px 96px', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 70% 30%, rgba(91,93,225,0.14), transparent 55%)', pointerEvents:'none' }}/>
      <div style={{ maxWidth:840, margin:'0 auto', position:'relative' }}>
        <div style={{ animation:'fadeInUp 0.6s ease 0.1s both' }}><SLabel>Our Story</SLabel></div>
        <div style={{ animation:'fadeInUp 0.7s ease 0.25s both' }}>
          <h1 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(42px,5.5vw,70px)', fontWeight:800, color:'#fff', letterSpacing:'-0.03em', lineHeight:1.1, marginBottom:28, textWrap:'balance' }}>
            We saw the problem.<br/>
            <span style={{ background:'linear-gradient(90deg,#5B5DE1,#9D5FE0)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>So we built the fix.</span>
          </h1>
        </div>
        <div style={{ animation:'fadeInUp 0.6s ease 0.4s both', maxWidth:620 }}>
          <p style={{ fontSize:22, color:'rgba(255,255,255,0.55)', lineHeight:1.8 }}>Too many businesses are slowed down by systems built for someone else. We built Nervari to change that.</p>
        </div>
      </div>
    </section>

    {/* EMPATHY BLOCK */}
    <section style={{ background:'#0d0c20', padding:'96px 32px' }}>
      <div style={{ maxWidth:840, margin:'0 auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:56, alignItems:'center' }}>
          <div>
            <SLabel color="#f87171">The Reality</SLabel>
            <h2 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(24px,3vw,36px)', fontWeight:700, color:'#fff', letterSpacing:'-0.02em', lineHeight:1.2, marginBottom:20 }}>Running a Business Shouldn't Mean Drowning in Admin</h2>
            <p style={{ fontSize:22, color:'rgba(255,255,255,0.5)', lineHeight:1.8, marginBottom:20 }}>Most small business owners aren't short on ideas or effort. They're short on time — because too much of it goes toward tasks that should be handled automatically.</p>
            <p style={{ fontSize:22, color:'rgba(255,255,255,0.5)', lineHeight:1.8 }}>Chasing invoices. Following up on quotes. Re-entering data. Coordinating handoffs. These aren't growth activities — they're operational drag. And most businesses are carrying far more of it than they realise.</p>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            {[
              { label:'Admin overload', stat:'6 hrs', desc:'per day lost to tasks that could be automated' },
              { label:'Revenue leakage', stat:'R10k+', desc:'per month from slow follow-ups and missed leads' },
              { label:'Owner dependency', stat:'High', desc:'business stalls the moment the owner steps back' },
              { label:'Team frustration', stat:'Common', desc:'good people doing repetitive manual work' },
            ].map(item => (
              <div key={item.label} style={{ display:'flex', gap:16, padding:'16px 18px', background:'rgba(220,38,38,0.05)', border:'1px solid rgba(220,38,38,0.14)', borderRadius:12, alignItems:'center' }}>
                <div style={{ flexShrink:0, textAlign:'center', minWidth:56 }}>
                  <div style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:800, fontSize:22, color:'#fca5a5' }}>{item.stat}</div>
                </div>
                <div>
                  <div style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:600, fontSize:19, color:'#f87171', marginBottom:2 }}>{item.label}</div>
                  <div style={{ fontSize:19, color:'rgba(255,255,255,0.42)', lineHeight:1.5 }}>{item.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>

    {/* HOW WE WORK */}
    <section style={{ background:'#0C0821', padding:'96px 32px' }}>
      <div style={{ maxWidth:840, margin:'0 auto' }}>
        <div style={{ textAlign:'center', marginBottom:52 }}>
          <SLabel>Our Approach</SLabel>
          <h2 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(26px,3.5vw,40px)', fontWeight:700, color:'#fff', letterSpacing:'-0.02em' }}>Practical. Not Overly Technical.</h2>
          <p style={{ fontSize:22, color:'rgba(255,255,255,0.4)', marginTop:12, maxWidth:480, margin:'12px auto 0' }}>We don't lead with technology. We lead with your problem — and then find the right tool to solve it.</p>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:20 }}>
          {[
            { icon:'ear', title:'We Listen First', desc:'Before we recommend anything, we understand how your business works — the good parts and the friction points.' },
            { icon:'map', title:'We Map Before We Build', desc:'We document the current workflow, find where it breaks, and design the right fix before any building starts.' },
            { icon:'graduation', title:'We Train and Hand Over', desc:'Every delivery includes training. Your team knows how to use it, check it, and get the most out of it.' },
            { icon:'phone', title:'We Stay Available', desc:'After launch, we don\'t disappear. We\'re available when you have questions or need to adjust something.' },
          ].map(v => (
            <div key={v.title} className="val-card" style={{ padding:'28px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:16 }}>
              <div style={{ width:48, height:48, borderRadius:11, border:'1px solid rgba(255,255,255,0.18)', display:'inline-flex', alignItems:'center', justifyContent:'center', color:'rgba(255,255,255,0.55)', marginBottom:14 }}><LineIcon name={v.icon} size={22}/></div>
              <div style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:22, color:'#fff', marginBottom:10 }}>{v.title}</div>
              <div style={{ fontSize:19, color:'rgba(255,255,255,0.48)', lineHeight:1.7 }}>{v.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </section>

    {/* TECH WITHOUT OVERWHELM */}
    <section style={{ background:'linear-gradient(135deg,#0f0d22,#131458)', padding:'96px 32px' }}>
      <div style={{ maxWidth:840, margin:'0 auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:56, alignItems:'center' }}>
          {/* team / process imagery — temporary illustrative placeholder */}
          <div style={{ position:'relative', borderRadius:20, background:'radial-gradient(circle at 30% 30%, rgba(119,218,251,0.10), transparent 65%), radial-gradient(circle at 75% 70%, rgba(186,80,235,0.10), transparent 65%), rgba(91,93,225,0.05)', border:'1px solid rgba(91,93,225,0.22)', height:280, overflow:'hidden' }}>
            <svg viewBox="0 0 400 280" width="100%" height="100%" style={{ display:'block' }}>
              <defs>
                <linearGradient id="nodeA" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stopColor="#77DAFB"/>
                  <stop offset="1" stopColor="#1859D1"/>
                </linearGradient>
                <linearGradient id="nodeB" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stopColor="#BA50EB"/>
                  <stop offset="1" stopColor="#5B5DE1"/>
                </linearGradient>
                <linearGradient id="lineGrad" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" stopColor="rgba(119,218,251,0.55)"/>
                  <stop offset="1" stopColor="rgba(186,80,235,0.55)"/>
                </linearGradient>
              </defs>
              {/* connecting lines */}
              <g stroke="url(#lineGrad)" strokeWidth="1.2" fill="none" strokeDasharray="3 4" opacity="0.7">
                <path d="M90 90 Q160 50 200 140"/>
                <path d="M200 140 Q260 200 320 110"/>
                <path d="M90 90 Q140 180 200 140"/>
                <path d="M320 110 Q280 60 200 140"/>
                <path d="M90 200 Q150 230 200 140"/>
                <path d="M320 210 Q260 240 200 140"/>
              </g>
              {/* people nodes — circles with stylised silhouettes */}
              {[
                { cx:90,  cy:90,  r:22, fill:'url(#nodeA)' },
                { cx:320, cy:110, r:22, fill:'url(#nodeB)' },
                { cx:200, cy:140, r:30, fill:'url(#nodeA)', main:true },
                { cx:90,  cy:200, r:22, fill:'url(#nodeB)' },
                { cx:320, cy:210, r:22, fill:'url(#nodeA)' },
              ].map((n, i) => (
                <g key={i} opacity={n.main ? 1 : 0.92}>
                  <circle cx={n.cx} cy={n.cy} r={n.r + 6} fill={n.fill} opacity="0.18"/>
                  <circle cx={n.cx} cy={n.cy} r={n.r} fill={n.fill}/>
                  {/* silhouette: head */}
                  <circle cx={n.cx} cy={n.cy - n.r*0.18} r={n.r*0.3} fill="rgba(255,255,255,0.92)"/>
                  {/* silhouette: shoulders */}
                  <path d={`M${n.cx - n.r*0.62} ${n.cy + n.r*0.55} Q${n.cx} ${n.cy + n.r*0.05} ${n.cx + n.r*0.62} ${n.cy + n.r*0.55} L${n.cx + n.r*0.62} ${n.cy + n.r*0.7} L${n.cx - n.r*0.62} ${n.cy + n.r*0.7} Z`} fill="rgba(255,255,255,0.92)"/>
                </g>
              ))}
              {/* tiny accent dots along paths */}
              <g fill="#77DAFB">
                <circle cx="155" cy="92"  r="2.5" opacity="0.9"/>
                <circle cx="262" cy="155" r="2.5" opacity="0.9"/>
                <circle cx="138" cy="178" r="2.5" opacity="0.7"/>
                <circle cx="265" cy="222" r="2.5" opacity="0.7"/>
              </g>
            </svg>
            <div style={{ position:'absolute', left:0, right:0, bottom:14, textAlign:'center', fontFamily:'Inter,sans-serif', fontSize:12, letterSpacing:2.5, textTransform:'uppercase', color:'rgba(255,255,255,0.32)', fontWeight:600 }}>People + Process, Connected</div>
          </div>
          <div>
            <SLabel>Our Promise</SLabel>
            <h2 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(24px,3vw,36px)', fontWeight:700, color:'#fff', letterSpacing:'-0.02em', lineHeight:1.2, marginBottom:16 }}>Technology Shouldn't Feel Intimidating</h2>
            <p style={{ fontSize:22, color:'rgba(255,255,255,0.52)', lineHeight:1.8, marginBottom:16 }}>A lot of people running small businesses didn't grow up inside digital systems. Modern tools can feel overwhelming — and the last thing you need is more complexity on your plate.</p>
            <p style={{ fontSize:22, color:'rgba(255,255,255,0.52)', lineHeight:1.8 }}>We are the translator. We take the technical side off your desk, and hand you back something that just works — clearly, reliably, and without requiring you to understand what's happening behind the scenes.</p>
          </div>
        </div>
      </div>
    </section>

    {/* TRUST / TOOLS */}
    <section style={{ background:'#0C0821', padding:'80px 32px' }}>
      <div style={{ maxWidth:840, margin:'0 auto', textAlign:'center' }}>
        <SLabel>How We Deliver</SLabel>
        <h2 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(24px,3vw,36px)', fontWeight:700, color:'#fff', letterSpacing:'-0.02em', marginBottom:12 }}>Popular Tools We Build With</h2>
        <p style={{ fontSize:19, color:'rgba(255,255,255,0.45)', marginBottom:52, maxWidth:560, marginLeft:'auto', marginRight:'auto', lineHeight:1.7 }}>A few of the systems we work across. Every project blends a handful of these into one quiet, reliable workflow.</p>

        {/* Main icon strip — 8 icons, no labels */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:32, justifyContent:'center', alignItems:'center', marginBottom:44 }}>
          {[
            { name:'n8n',           slug:'n8n'           },
            { name:'ChatGPT',       svg:'openai'         },
            { name:'Claude',        slug:'claude'        },
            { name:'Gemini',        slug:'googlegemini'  },
            { name:'WhatsApp',      slug:'whatsapp'      },
            { name:'Slack',         svg:'slack'          },
            { name:'Google',        slug:'google'        },
            { name:'Microsoft 365', svg:'microsoft'      },
          ].map(t => {
            const base = { opacity:0.72, transition:'opacity 0.2s, transform 0.22s', display:'block', cursor:'default' };
            const enter = e => { e.currentTarget.style.opacity='1'; e.currentTarget.style.transform='translateY(-3px) scale(1.12)'; };
            const leave = e => { e.currentTarget.style.opacity='0.72'; e.currentTarget.style.transform='translateY(0) scale(1)'; };
            if (t.svg) {
              return (
                <span key={t.name} title={t.name} aria-label={t.name} style={{ ...base, width:44, height:44 }} onMouseEnter={enter} onMouseLeave={leave}>
                  <BrandIcon name={t.svg} size={44}/>
                </span>
              );
            }
            return (
              <img
                key={t.name}
                src={`https://cdn.simpleicons.org/${t.slug}`}
                alt={t.name}
                title={t.name}
                width="44"
                height="44"
                style={{ ...base, filter:'brightness(0) invert(1)' }}
                onMouseEnter={enter}
                onMouseLeave={leave}
              />
            );
          })}
        </div>

        {/* AND MORE strip */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:24, flexWrap:'wrap', paddingTop:24, borderTop:'1px solid rgba(255,255,255,0.05)' }}>
          <span style={{ fontFamily:'Inter,sans-serif', fontSize:11, fontWeight:600, letterSpacing:2.5, textTransform:'uppercase', color:'rgba(255,255,255,0.28)' }}>and many more</span>
          {[
            { name:'Discord',    slug:'discord'    },
            { name:'Telegram',   slug:'telegram'   },
            { name:'Zapier',     slug:'zapier'     },
            { name:'Notion',     slug:'notion'     },
            { name:'Stripe',     slug:'stripe'     },
            { name:'Make',       slug:'make'       },
            { name:'ElevenLabs', slug:'elevenlabs' },
            { name:'Airtable',   slug:'airtable'   },
          ].map(t => (
            <img
              key={t.name}
              src={`https://cdn.simpleicons.org/${t.slug}`}
              alt={t.name}
              title={t.name}
              width="26"
              height="26"
              style={{ opacity:0.4, filter:'brightness(0) invert(1)', transition:'opacity 0.2s, transform 0.2s', display:'block' }}
              onMouseEnter={e => { e.currentTarget.style.opacity='0.8'; e.currentTarget.style.transform='translateY(-2px)'; }}
              onMouseLeave={e => { e.currentTarget.style.opacity='0.4'; e.currentTarget.style.transform='translateY(0)'; }}
            />
          ))}
        </div>
      </div>
    </section>

    {/* CTA */}
    <section style={{ background:'linear-gradient(135deg,#0d0c20,#131458)', padding:'96px 32px', textAlign:'center', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 0%, rgba(91,93,225,0.22), transparent 65%)', pointerEvents:'none' }}/>
      <div style={{ maxWidth:580, margin:'0 auto', position:'relative' }}>
        <SLabel color="#A8D8F4">Work With Us</SLabel>
        <h2 style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:'clamp(32px,4.5vw,54px)', fontWeight:800, color:'#fff', letterSpacing:'-0.03em', lineHeight:1.1, marginBottom:18, textWrap:'balance' }}>Ready to Remove the Drag from Your Business?</h2>
        <p style={{ fontSize:19, color:'rgba(255,255,255,0.46)', lineHeight:1.75, marginBottom:36 }}>Book a free call. We'll listen, understand what's slowing you down, and tell you honestly what we can do about it.</p>
        <SBtn href="contact.html" variant="primary" style={{ fontSize:19, padding:'14px 38px' }}>Book a Call</SBtn>
      </div>
    </section>

    <SiteFooter/>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<WhoPage/>);
</script>
<div id="root"></div>
</body>
</html>
